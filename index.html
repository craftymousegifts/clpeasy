<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLPeasy — Coming Soon</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--teal:#0D9488;--teal-light:#14B8A6;--teal-pale:#E6FAF8;}
body{font-family:'DM Sans',sans-serif;background:#F7F8FA;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 24px 80px;-webkit-font-smoothing:antialiased;flex-direction:column;}

/* ── CARD ─────────────────────────────────────────────────────── */
.card{background:white;border-radius:24px;padding:52px 48px 44px;max-width:500px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,0.08);}
.logo{display:flex;align-items:center;justify-content:center;margin-bottom:28px;}
.logo-badge{width:64px;height:64px;border-radius:50%;background:var(--teal);color:white;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;}
.logo-easy{font-size:36px;font-weight:900;color:var(--teal);margin-left:5px;}
.pill{display:inline-block;background:var(--teal-pale);color:var(--teal);font-size:13px;font-weight:600;padding:6px 14px;border-radius:20px;margin-bottom:20px;}
h1{font-family:'DM Serif Display',serif;font-size:30px;color:#111318;margin-bottom:12px;}
.subtitle{font-size:15px;color:#6B7280;line-height:1.7;margin-bottom:28px;}

/* countdown etc unchanged */
.countdown-label{font-size:12px;font-weight:600;color:#9CA3AF;text-transform:uppercase;}
.countdown{display:flex;justify-content:center;gap:12px;margin-bottom:28px;}
.cd-num{background:#111318;color:white;font-size:32px;width:72px;height:72px;border-radius:14px;display:flex;align-items:center;justify-content:center;}
.cd-label{font-size:10px;color:#9CA3AF;}
.cd-sep{font-size:28px;color:#D1D5DB;}

.launch-date{background:#E6FAF8;border-radius:14px;padding:14px 20px;margin-bottom:24px;}
.launch-date-text{font-size:13px;font-weight:600;color:var(--teal);}

.email-note{font-size:13px;color:#9CA3AF;}
.email-note a{color:var(--teal);font-weight:600;text-decoration:none;}
</style>
</head>

<body>

<div class="card">

  <div class="logo">
    <div class="logo-badge">CLP</div>
    <span class="logo-easy">easy</span>
  </div>

  <div class="pill">Coming soon</div>

  <h1>Something exciting<br>is on its way</h1>

  <p class="subtitle">
    CLPeasy makes CLP labelling simple for creative makers.
  </p>

  <!-- Countdown -->
  <div class="countdown-label">Launching in</div>

  <div class="countdown">
    <div class="cd-num" id="cd-days">00</div>
    <div class="cd-sep">:</div>
    <div class="cd-num" id="cd-hours">00</div>
    <div class="cd-sep">:</div>
    <div class="cd-num" id="cd-mins">00</div>
    <div class="cd-sep">:</div>
    <div class="cd-num" id="cd-secs">00</div>
  </div>

  <div class="launch-date">
    <span class="launch-date-text">Launching Monday 15 June 2026</span>
  </div>

  <p class="email-note">
    Want to be first to know?<br>
    <a href="mailto:support@clpeasy.com">support@clpeasy.com</a>
  </p>

  <!-- ✅ STRIPE GOES HERE (INSIDE CARD, CLEAN) -->
  <div style="margin-top:40px; padding:10px;">

    <script async src="https://js.stripe.com/v3/pricing-table.js"></script>

    <stripe-pricing-table
      pricing-table-id="prctbl_1TdoeKGZLILz5vqUx4xbHJnu"
      publishable-key="pk_live_51TdczNGZLILz5vqULMO4CDSLAecJW5THMU5HADvJniGDUp0Vd6Z2KQbA686mBtU6tyjBcRtiW5QbeII31LUuQyp900fKF27IXf">
    </stripe-pricing-table>

  </div>

</div>

</body>
</html>
