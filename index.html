<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLPeasy — Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--teal:#0D9488;}
body{font-family:'DM Sans',sans-serif;background:#F7F8FA;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased;}
.card{background:white;border-radius:24px;padding:56px 48px;max-width:480px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,0.08);}
.logo{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:32px;}
.logo-badge{width:64px;height:64px;border-radius:50%;background:var(--teal);color:white;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;letter-spacing:-1px;font-family:'DM Sans',sans-serif;}
.logo-easy{font-size:36px;font-weight:900;color:var(--teal);margin-left:5px;letter-spacing:-1px;}
h1{font-family:'DM Serif Display',serif;font-size:32px;color:#111318;margin-bottom:12px;}
p{font-size:15px;color:#6B7280;line-height:1.7;margin-bottom:24px;}
.pill{display:inline-block;background:#E6FAF8;color:var(--teal);font-size:13px;font-weight:600;padding:6px 14px;border-radius:20px;margin-bottom:24px;}
.footer{margin-top:32px;font-size:12px;color:#9CA3AF;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-badge">CLP</div>
    <span class="logo-easy">easy</span>
  </div>
  <div class="pill">Coming soon</div>
  <h1>Something exciting<br>is on its way</h1>
  <p>CLPeasy is a brand new tool that makes CLP labelling simple for candle and wax melt makers. We're putting the finishing touches on — check back very soon!</p>
  <p style="font-size:13px;color:#9CA3AF;">Want to be first to know? Email us at<br><a href="mailto:support@clpeasy.com" style="color:#0D9488;text-decoration:none;font-weight:600;">support@clpeasy.com</a></p>
</div>
</body>
</html>
