name: Temporary M37 M64 focused QA
on:
  push:
    branches:
      - audit/m37-m64-pictogram-precedence
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install Chromium
        run: |
          npx puppeteer browsers install chrome
          echo "PUPPETEER_EXECUTABLE_PATH=$(find "$HOME/.cache/puppeteer/chrome" -type f -path '*/chrome-linux64/chrome' | head -1)" >> "$GITHUB_ENV"
      - run: node tests/m37-m64-pictogram-precedence.js
      - run: node tests/unknown-pictogram-keys.js
        timeout-minutes: 3
      - run: node tests/required-content-export-blocking.js
        timeout-minutes: 5
      - run: npm test
