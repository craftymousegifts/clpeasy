name: Customer experience preview checks
on:
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/customer-experience-preview.yml'
permissions:
  contents: read
jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Application syntax and account-action checks
        run: |
          node tests/app-static-audit.js
          if test -f tests/sidebar-account-actions.js; then node tests/sidebar-account-actions.js; fi
      - name: Short-screen and desktop account actions (mock services)
        run: |
          if test -f tests/mobile-sidebar-logout-reachable.js; then node tests/mobile-sidebar-logout-reachable.js; fi
      - name: Builder sign-in and trial, PAYG and annual download entitlements (mock services)
        run: |
          node tests/builder-requires-sign-in.js
          node tests/builder-sign-in-entitlements.js
      - name: Composer controls (mock services)
        run: node tests/composer-cutting-button-and-eu30009.js
      - name: Release notes checks
        run: |
          node tests/versioning-and-release-notes.js
          if test -f tests/release-notes-grouping.js; then node tests/release-notes-grouping.js; fi
          if test -f tests/release-notes-browser.js; then node tests/release-notes-browser.js; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-experience-screenshots
          path: qa-artifacts/customer-experience/
          if-no-files-found: ignore
          retention-days: 7
