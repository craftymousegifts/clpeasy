name: Apply SDS PDF column fix (QA branch only)
on:
  push:
    branches:
      - qa/smart-paste-sds-corpus
    paths:
      - scripts/apply-sds-pdf-column-fix.js
      - .github/workflows/apply-sds-pdf-column-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/smart-paste-sds-corpus
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded Smart Paste PDF normalisation
        run: node scripts/apply-sds-pdf-column-fix.js
      - name: Check builder script syntax and normalisation regression
        run: |
          node --check scripts/apply-sds-pdf-column-fix.js
          grep -q 'function normalisePdfSdsText' builder.html
          grep -q 'Information:' builder.html
      - name: Commit to isolated QA branch
        run: |
          if git diff --quiet -- builder.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- builder.html
          git commit -m "fix: clean PDF column labels from EUH208 ingredient names"
          git push origin HEAD:qa/smart-paste-sds-corpus
