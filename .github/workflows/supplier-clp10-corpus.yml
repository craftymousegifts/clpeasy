name: Supplier 10% candle-wax SDS collection (isolated)
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum verified supplier 10% PDFs (1–100)'
        required: false
        default: '20'
jobs:
  collect-10-percent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Collect public supplier 10% candle-wax PDFs
        env:
          CLP10_LIMIT: ${{ inputs.limit || '20' }}
        run: node scripts/collect-public-clp10-corpus.js
      - name: Preserve originals, extracted Section 2.2 and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clp10-supplier-documents
          path: qa-artifacts/clp10-corpus/
          retention-days: 7
