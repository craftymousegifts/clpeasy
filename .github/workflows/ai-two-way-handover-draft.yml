name: AI Two-way Handover (offline simulation only)
on:
  push:
    branches:
      - automation/ai-two-way-handover-draft
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run all offline regression tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_ai_*.py' -v
      - name: Run end-to-end offline integration smoke check
        run: python3 .github/scripts/ai_integration_smoke.py
      - name: Simulate both handover directions
        run: python3 .github/scripts/ai_handover_bridge.py --output ai-handover-simulation.json
      - name: Print safe simulation result
        run: |
          echo "Offline handover simulation passed. No external AI invoked." >> "$GITHUB_STEP_SUMMARY"
          echo "No issue comments, commits, merges or deployments performed by this job." >> "$GITHUB_STEP_SUMMARY"
