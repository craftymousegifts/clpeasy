<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safety Information — CLPeasy</title>
<meta name="description" content="Digital safety data sheet for a CLPeasy label. Contains CLP hazard information, signal word, GHS pictograms and precautionary statements.">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--teal:#4C9BB0;--border:#E8EAED;--text:#111318;--muted:#6B7280;--off:#F7F8FA;--red:#DC2626;}
body{font-family:'DM Sans',sans-serif;background:var(--off);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}
nav{background:white;border-bottom:1px solid var(--border);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;}
.nav-logo{display:flex;align-items:center;text-decoration:none;}
.nav-badge{width:52px;height:52px;border-radius:50%;background:var(--teal);color:white;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;letter-spacing:-1px;flex-shrink:0;}
.nav-easy{font-size:26px;font-weight:900;color:var(--teal);margin-left:4px;letter-spacing:-1px;}
.container{max-width:600px;margin:0 auto;padding:32px 20px 60px;}
.safety-card{background:white;border-radius:16px;border:1px solid var(--border);overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.06);}
.safety-header{background:linear-gradient(135deg,#4C9BB0,#3a7d8f);padding:24px;color:white;}
.safety-header h1{font-family:'DM Serif Display',serif;font-size:24px;margin-bottom:4px;}
.safety-header .subtitle{font-size:13px;opacity:0.8;}
.safety-body{padding:24px;}
.section{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border);}
.section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);margin-bottom:10px;}
.product-name{font-family:'DM Serif Display',serif;font-size:28px;color:var(--text);margin-bottom:4px;}
.product-type{font-size:14px;color:var(--muted);margin-bottom:16px;}
.signal-badge{display:inline-flex;align-items:center;gap:6px;background:#FEF2F2;border:1.5px solid #FECACA;color:var(--red);padding:6px 14px;border-radius:8px;font-size:14px;font-weight:700;letter-spacing:0.5px;}
.signal-badge.warning{background:#FFFBEB;border-color:#FDE68A;color:#92400E;}
.ghs-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;}
.ghs-diamond{width:56px;height:56px;border:2.5px solid var(--red);transform:rotate(45deg);display:flex;align-items:center;justify-content:center;background:white;border-radius:3px;}
.ghs-diamond span{transform:rotate(-45deg);font-size:10px;font-weight:700;color:var(--red);text-align:center;line-height:1.2;}
.h-list{display:flex;flex-direction:column;gap:6px;}
.h-item{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;background:var(--off);border-radius:8px;font-size:13px;}
.h-code{font-weight:700;color:var(--red);flex-shrink:0;min-width:50px;}
.contains-box{background:var(--off);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:14px;line-height:1.6;}
.contains-box strong{display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-bottom:4px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.info-item{background:var(--off);border-radius:8px;padding:12px;}
.info-label{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-bottom:3px;}
.info-value{font-size:14px;font-weight:600;color:var(--text);}
.ufi-box{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:10px;padding:14px;font-size:13px;}
.ufi-box strong{display:block;color:#166534;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:3px;}
.ufi-code{font-family:monospace;font-size:16px;color:#166534;font-weight:700;letter-spacing:2px;}
.not-found{text-align:center;padding:60px 20px;}
.not-found-icon{font-size:48px;margin-bottom:16px;}
footer{text-align:center;padding:24px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);margin-top:32px;}
footer a{color:var(--teal);text-decoration:none;}
@media(max-width:480px){.info-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo"><div class="nav-badge">CLP</div><span class="nav-easy">easy</span></a>
  <span style="font-size:12px;color:var(--muted);">Safety Information</span>
</nav>

<div class="container">
  <div id="safety-content">
    <div style="text-align:center;padding:40px 0;color:var(--muted);">Loading safety information...</div>
  </div>
</div>

<footer>&copy; 2026 CLPeasy &nbsp;·&nbsp; <a href="index.html">Home</a> &nbsp;·&nbsp; <a href="privacy.html">Privacy</a></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://qvkosdqcryrcfbjtaxic.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2a29zZHFjcnlyY2ZianRheGljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MTkzOTIsImV4cCI6MjA5NTI5NTM5Mn0.Uo18YEjMKN3vgQ4WGgrdZR4eVa85M1ubAv-FIYUYAYw';

const GHS_LABELS={
  flame:'Flammable',exclamation:'Irritant',health:'Health hazard',aquatic:'Aquatic toxicity',
  corrosive:'Corrosive',skull:'Toxic',oxidiser:'Oxidising',gas:'Gas under pressure',explosion:'Explosive'
};

const H_DESCRIPTIONS={
  H290:'May be corrosive to metals.',H300:'Fatal if swallowed.',H301:'Toxic if swallowed.',
  H302:'Harmful if swallowed.',H304:'May be fatal if swallowed and enters airways.',
  H310:'Fatal in contact with skin.',H311:'Toxic in contact with skin.',H312:'Harmful in contact with skin.',
  H314:'Causes severe skin burns and eye damage.',H315:'Causes skin irritation.',
  H317:'May cause allergic skin reaction.',H318:'Causes serious eye damage.',
  H319:'Causes serious eye irritation.',H330:'Fatal if inhaled.',H331:'Toxic if inhaled.',
  H332:'Harmful if inhaled.',H334:'May cause allergy or asthma symptoms if inhaled.',
  H335:'May cause respiratory irritation.',H336:'May cause drowsiness or dizziness.',
  H340:'May cause genetic defects.',H341:'Suspected of causing genetic defects.',
  H350:'May cause cancer.',H351:'Suspected of causing cancer.',
  H360:'May damage fertility or the unborn child.',H361:'Suspected of damaging fertility.',
  H370:'Causes damage to organs.',H371:'May cause damage to organs.',
  H372:'Causes damage to organs through prolonged exposure.',
  H373:'May cause damage to organs through prolonged exposure.',
  H400:'Very toxic to aquatic life.',H410:'Very toxic to aquatic life with long lasting effects.',
  H411:'Toxic to aquatic life with long lasting effects.',
  H412:'Harmful to aquatic life with long lasting effects.',
  H413:'May cause long lasting harmful effects to aquatic life.',
  EUH208:'Contains sensitiser. May produce an allergic reaction.',
  EUH210:'Safety data sheet available on request.',
};

function getSignalClass(sig){return sig==='DANGER'?'':'warning';}

function renderSafety(label){
  const hCodes=(label.hStatements||'').split(',').map(h=>h.trim()).filter(Boolean);
  const pictos=label.pictograms||['exclamation','aquatic'];
  const sensArr=label.sensitisers||[];
  const ufi=label.ufiCode||'';

  const ghs=pictos.map(p=>`<div class="ghs-diamond"><span>${p.toUpperCase().substring(0,8)}</span></div>`).join('');

  const hItems=hCodes.map(h=>`<div class="h-item"><span class="h-code">${h}</span><span>${H_DESCRIPTIONS[h]||''}</span></div>`).join('');

  const infoItems=[
    label.bizName?`<div class="info-item"><div class="info-label">Responsible Person</div><div class="info-value">${label.bizName}</div></div>`:'',
    label.bizAddress?`<div class="info-item"><div class="info-label">Address</div><div class="info-value">${label.bizAddress}</div></div>`:'',
    label.bizPhone?`<div class="info-item"><div class="info-label">Contact</div><div class="info-value">${label.bizPhone}</div></div>`:'',
    label.netWeight?`<div class="info-item"><div class="info-label">Net Weight</div><div class="info-value">${label.netWeight}</div></div>`:'',
    label.burnTime?`<div class="info-item"><div class="info-label">Burn Time</div><div class="info-value">${label.burnTime}</div></div>`:'',
    label.batchNum?`<div class="info-item"><div class="info-label">Batch</div><div class="info-value">${label.batchNum}</div></div>`:'',
  ].filter(Boolean).join('');

  document.getElementById('safety-content').innerHTML=`
    <div class="safety-card">
      <div class="safety-header">
        <h1>${label.scentName||'Product Safety Information'}</h1>
        <div class="subtitle">${label.productType||'Fragrance product'} &nbsp;·&nbsp; CLP Safety Sheet &nbsp;·&nbsp; Updated ${label.savedAt||'—'}</div>
      </div>
      <div class="safety-body">
        <div class="section">
          <div class="section-title">Signal Word</div>
          <div class="signal-badge ${getSignalClass(label.signal||'WARNING')}">⚠ ${label.signal||'WARNING'}</div>
          ${ghs?`<div class="ghs-row">${ghs}</div>`:''}
        </div>
        ${hItems?`<div class="section"><div class="section-title">Hazard Statements</div><div class="h-list">${hItems}</div></div>`:''}
        ${sensArr.length?`<div class="section"><div class="section-title">Contains</div><div class="contains-box"><strong>Sensitising ingredients</strong>${sensArr.join(', ')}</div></div>`:''}
        ${infoItems?`<div class="section"><div class="section-title">Manufacturer / Responsible Person</div><div class="info-grid">${infoItems}</div></div>`:''}
        ${ufi?`<div class="section"><div class="ufi-box"><strong>UFI — Unique Formula Identifier</strong><div class="ufi-code">${ufi}</div></div></div>`:''}
        <div class="section" style="background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:14px;margin-bottom:0;">
          <div style="font-size:13px;color:#92400E;line-height:1.6;">
            <strong style="display:block;margin-bottom:4px;">⚠️ Important safety information</strong>
            Keep out of reach of children. Do not leave burning candles unattended. Keep away from flammable materials. This product is intended for use as directed. If you experience skin irritation or allergic reaction, discontinue use and seek medical advice.
          </div>
        </div>
      </div>
    </div>
    <div style="margin-top:16px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6;">
      This safety sheet was generated by <a href="index.html" style="color:var(--teal);">CLPeasy</a> and reflects the label data entered by the product manufacturer. Always verify hazard information against the current SDS for your fragrance at your actual fragrance load.
    </div>`;
}

function renderNotFound(){
  document.getElementById('safety-content').innerHTML=`
    <div class="not-found">
      <div class="not-found-icon">🔍</div>
      <h2 style="font-family:'DM Serif Display',serif;font-size:24px;margin-bottom:8px;">Safety sheet not found</h2>
      <p style="color:var(--muted);font-size:14px;line-height:1.6;">This safety sheet may have been removed or the link may be incorrect.<br>If you scanned this QR code from a product, please contact the manufacturer.</p>
      <a href="index.html" style="display:inline-block;margin-top:20px;background:var(--teal);color:white;padding:10px 24px;border-radius:10px;text-decoration:none;font-weight:600;font-size:14px;">Go to CLPeasy</a>
    </div>`;
}

async function loadSafetySheet(){
  // Get uid from URL: /safety/ABCD1234 or ?id=ABCD1234
  const path=window.location.pathname;
  const search=new URLSearchParams(window.location.search);
  const uid=path.split('/').filter(Boolean).pop()||search.get('id')||search.get('uid')||'';

  if(!uid||uid==='safety.html'){renderNotFound();return;}

  try{
    const{createClient}=window.supabase;
    const sb=createClient(SUPABASE_URL,SUPABASE_KEY);
    const{data,error}=await sb.from('safety_sheets').select('*').eq('uid',uid).single();
    if(error||!data){renderNotFound();return;}
    renderSafety(data.label_data||data);
  }catch(e){
    // Fallback: try localStorage (for demo/testing)
    const stored=localStorage.getItem('clpeasy_safety_'+uid);
    if(stored){try{renderSafety(JSON.parse(stored));}catch(e2){renderNotFound();}}
    else renderNotFound();
  }
}

loadSafetySheet();
</script>
</body>
</html>
