<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CLPeasy</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'DM Sans',system-ui,sans-serif;background:#0d1b2a;color:#c8dde8;min-height:100vh;padding-bottom:90px;font-size:14px;}

/* GATE — CSS only, no JS required */
#gate-wrap{position:fixed;inset:0;background:#0d1b2a;display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px;}
#gate-unlock{display:none;}
#gate-unlock:checked ~ #gate-wrap{display:none;}
#gate-unlock:checked ~ #app{display:block !important;}
.gate-card{background:#111d2c;border:1px solid #1e3048;border-top:3px solid #4C9BB0;border-radius:16px;padding:36px 24px;width:100%;max-width:360px;text-align:center;}
.gate-input{width:100%;background:#0d1b2a;border:1.5px solid #1e3048;border-radius:10px;padding:14px 16px;font-size:16px;color:#e8f4f8;font-family:inherit;outline:none;margin-bottom:14px;letter-spacing:2px;}
.gate-input:focus{border-color:#4C9BB0;}
.gate-btn{width:100%;background:#4C9BB0;border:none;border-radius:10px;padding:15px;font-size:15px;font-weight:800;color:#fff;cursor:pointer;font-family:inherit;margin-top:10px;display:block;}
.gate-error{color:#e74c3c;font-size:12px;margin-top:6px;display:none;}

/* HEADER */
#app{display:none;}
#gate-unlock:checked ~ #app{display:block !important;}
.hdr{background:linear-gradient(135deg,#0a1520,#152230);border-bottom:1px solid #1e3048;padding:12px 16px;position:sticky;top:0;z-index:100;}
.hdr-inner{display:flex;align-items:center;gap:10px;}
.hdr-logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#4C9BB0,#3a7d8f);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:8px;color:#fff;flex-shrink:0;letter-spacing:-0.3px;}
.hdr-title{font-size:15px;font-weight:900;color:#e8f4f8;}
.hdr-sub{font-size:10px;color:#4C9BB0;margin-top:1px;}

/* PROGRESS */
.prog-wrap{padding:12px 16px 0;}
.prog-card{background:#111d2c;border:1px solid #1e3048;border-radius:12px;padding:14px;}
.prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.prog-top span:first-child{font-size:13px;font-weight:800;color:#e8f4f8;}
.prog-pct{font-size:22px;font-weight:900;color:#27ae60;}
.prog-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:1px;margin-bottom:10px;}
.prog-legend{display:flex;flex-wrap:wrap;gap:10px;}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;}
.leg-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}

/* NAV TABS */
.nav-tabs{display:flex;padding:10px 16px 0;gap:6px;overflow-x:auto;}
.nav-tabs::-webkit-scrollbar{display:none;}
.ntab{flex-shrink:0;background:#1a2d42;border:none;border-radius:9px;padding:9px 15px;font-size:12px;font-weight:700;color:#7a9fb5;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all 0.2s;}
.ntab.active{background:#4C9BB0;color:#fff;}

/* CONTENT */
.content{padding:12px 16px;}

/* SECTION HEADER */
.sec-hdr{padding:10px 14px;border-radius:10px 10px 0 0;border-top:3px solid #4C9BB0;background:#111d2c;border:1px solid #1e3048;border-top:3px solid #4C9BB0;margin-bottom:0;}
.sec-name{font-size:12px;font-weight:900;letter-spacing:0.5px;}
.sec-meta{font-size:10px;color:#7a9fb5;margin-top:2px;font-style:italic;}

/* STORY CARD — main */
.sc{background:#111d2c;border:1px solid #1e3048;border-left:4px solid #4C9BB0;border-radius:12px;margin-bottom:10px;overflow:hidden;}
.sc-top{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.sc-left{flex:1;min-width:0;}
.sc-ids{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px;align-items:center;}
.sc-id{font-size:9px;font-weight:800;color:#4C9BB0;}
.chip{font-size:9px;font-weight:700;border-radius:4px;padding:2px 6px;white-space:nowrap;}
.sc-title{font-size:14px;font-weight:800;color:#e8f4f8;line-height:1.3;margin-bottom:4px;}
.sc-story{font-size:11px;color:#7a9fb5;line-height:1.5;margin-bottom:6px;}
.sc-meta-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
.sc-meta-chip{font-size:10px;color:#4a6580;background:#0d1b2a;border-radius:5px;padding:3px 8px;}
.sc-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
.pts-badge{font-size:13px;font-weight:900;color:#4C9BB0;}
.status-btn{border:none;border-radius:6px;padding:5px 9px;font-size:10px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;min-width:72px;text-align:center;}
.expand-row{padding:0 14px 10px;display:flex;gap:6px;flex-wrap:wrap;}
.exp-btn{background:#0d1b2a;border:1px solid #1e3048;border-radius:6px;padding:5px 10px;font-size:10px;font-weight:700;color:#4C9BB0;cursor:pointer;font-family:inherit;}

/* DETAIL PANEL */
.detail-panel{background:#0a1520;border-top:1px solid #1e3048;padding:12px 14px;display:none;}
.detail-panel.open{display:block;}
.dp-section{margin-bottom:12px;}
.dp-label{font-size:9px;font-weight:900;letter-spacing:0.6px;margin-bottom:7px;}
.dp-item{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;padding:6px 8px;background:#111d2c;border-radius:6px;}
.dp-num{font-size:10px;font-weight:800;flex-shrink:0;width:18px;color:#4C9BB0;}
.dp-check{font-size:13px;flex-shrink:0;margin-top:1px;cursor:pointer;}
.dp-text{font-size:11px;color:#a8c8d8;line-height:1.4;flex:1;}
.dp-text.struck{text-decoration:line-through;color:#4a6580;}
.ac-tick{color:#27ae60;font-size:12px;flex-shrink:0;margin-top:1px;}

/* SPRINT KANBAN */
.sprint-block{margin-bottom:14px;}
.sprint-hdr{background:#111d2c;border:1px solid #1e3048;border-top:3px solid #4C9BB0;border-radius:12px 12px 0 0;padding:12px 14px;}
.sprint-hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.sprint-name{font-size:12px;font-weight:900;letter-spacing:0.4px;}
.sprint-kpi{font-size:12px;font-weight:900;}
.sprint-goal{font-size:10px;color:#7a9fb5;font-style:italic;margin-bottom:2px;}
.sprint-weeks{font-size:10px;color:#7a9fb5;margin-bottom:6px;}
.cap-wrap{background:#0d1b2a;border-radius:3px;height:5px;overflow:hidden;}
.cap-fill{height:100%;border-radius:3px;transition:width 0.4s;}
.cap-row{display:flex;justify-content:space-between;font-size:9px;margin-top:3px;}
.lanes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;background:#111d2c;border:1px solid #1e3048;border-top:none;border-radius:0 0 12px 12px;padding:8px;}
.lane{background:#0a1520;border-radius:8px;padding:7px 6px;}
.lane-hdr{display:flex;align-items:center;gap:4px;margin-bottom:6px;}
.lane-dot{width:7px;height:7px;border-radius:50%;}
.lane-lbl{font-size:9px;font-weight:900;letter-spacing:0.3px;}
.lane-ct{margin-left:auto;font-size:9px;color:#4a6580;font-weight:700;}
.lane-empty{border:1px dashed #1e3048;border-radius:5px;padding:10px 4px;text-align:center;font-size:9px;color:#2d4a5e;}
.kcard{background:#111d2c;border-left:3px solid #4C9BB0;border-radius:6px;padding:7px 8px;margin-bottom:5px;cursor:pointer;}
.kcard-id{font-size:8px;font-weight:800;margin-bottom:2px;}
.kcard-title{font-size:10px;font-weight:700;color:#e8f4f8;line-height:1.3;margin-bottom:4px;}
.kcard-footer{display:flex;justify-content:space-between;align-items:center;gap:4px;}
.kcard-pts{font-size:8px;color:#4a6580;}

/* MOVE MODAL */
.overlay{position:fixed;inset:0;background:#000000aa;z-index:800;display:none;align-items:flex-end;justify-content:center;}
.overlay.open{display:flex;}
.sheet{background:#111d2c;border-radius:18px 18px 0 0;padding:20px 16px 36px;width:100%;max-width:500px;}
.sheet h3{font-size:16px;font-weight:900;color:#e8f4f8;margin-bottom:4px;}
.sheet p{font-size:11px;color:#7a9fb5;margin-bottom:16px;}
.sheet-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;}
.sheet-btn{background:#0d1b2a;border:1.5px solid #1e3048;border-radius:10px;padding:14px 6px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;text-align:center;transition:all 0.15s;}
.sheet-cancel{width:100%;background:transparent;border:1px solid #1e3048;border-radius:10px;padding:12px;font-size:13px;font-weight:700;color:#7a9fb5;cursor:pointer;font-family:inherit;margin-top:4px;}
.sheet-sprint-grid{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:12px;}
.sheet-sprint-btn{background:#0d1b2a;border:1px solid #1e3048;border-radius:8px;padding:12px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;text-align:left;color:#e8f4f8;}

/* BACKLOG SECTION */
.bl-section{margin-bottom:16px;}
.bl-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:10px 14px;background:#111d2c;border-radius:10px;border-left:4px solid #4C9BB0;}
.bl-pri{font-size:13px;font-weight:900;}
.bl-badge{font-size:10px;font-weight:700;border-radius:5px;padding:2px 8px;}

/* FILTER BAR */
.fbar{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px;}
.fbar::-webkit-scrollbar{display:none;}
.fbtn{flex-shrink:0;background:#1a2d42;border:none;border-radius:6px;padding:6px 10px;font-size:10px;font-weight:700;color:#7a9fb5;cursor:pointer;font-family:inherit;white-space:nowrap;}
.fbtn.active{color:#fff;}

/* TOAST */
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e3048;color:#e8f4f8;border-radius:10px;padding:10px 20px;font-weight:700;font-size:12px;z-index:999;opacity:0;transition:all 0.3s;pointer-events:none;white-space:nowrap;border:1px solid #4C9BB044;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;background:#111d2c;border-top:1px solid #1e3048;display:flex;padding:8px 0 16px;z-index:200;safe-area-inset-bottom:env(safe-area-inset-bottom);}
.bnav-btn{flex:1;background:none;border:none;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;}
.bnav-btn span:first-child{font-size:20px;line-height:1;}
.bnav-btn span:last-child{font-size:9px;font-weight:700;color:#7a9fb5;}
.bnav-btn.active span:last-child{color:#4C9BB0;}
</style>
</head>
<body>

<!-- GATE — pure CSS, no JS -->
<input type="checkbox" id="gate-unlock">
<div id="gate-wrap">
  <div class="gate-card">
    <div style="display:flex;justify-content:center;margin-bottom:20px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 80" style="width:147px;height:56px;display:block;">
  <circle cx="40" cy="40" r="38" fill="#4C9BB0"/>
  <text x="40" y="47" font-family="DM Sans,Arial,sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">CLP</text>
  <text x="128" y="52" font-family="DM Sans,Arial,sans-serif" font-weight="400" font-size="38" fill="#4C9BB0" text-anchor="middle" letter-spacing="-1">easy</text>
</svg></div>
    <p style="font-size:12px;color:#7a9fb5;margin-bottom:24px;">Admin access only</p>
    <input class="gate-input" type="password" id="pwInput" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')document.getElementById('gateBtn').click()">
    <label class="gate-btn" id="gateBtn" onclick="(function(){var v=document.getElementById('pwInput').value;if(v==='CLPeasy2026!'){document.getElementById('gate-unlock').checked=true;document.getElementById('gate-wrap').style.display='none';document.getElementById('app').style.display='block';setTimeout(function(){if(typeof init==='function')init();},100);}else{document.getElementById('gateErr').style.display='block';}})()">Enter</label>
    <div class="gate-error" id="gateErr" style="display:none">Incorrect password — try again</div>
  </div>
</div>

<!-- MOVE MODAL -->
<div class="overlay" id="moveModal">
  <div class="sheet">
    <h3 id="mm-title">Move story</h3>
    <p id="mm-sub">Choose sprint and lane</p>
    <div id="mm-body"></div>
    <button class="sheet-cancel" onclick="closeModal()">Cancel</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="hdr">
    <div class="hdr-inner" style="gap:12px">
      <div style="flex-shrink:0"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 80" style="width:147px;height:56px;display:block;">
  <circle cx="40" cy="40" r="38" fill="#4C9BB0"/>
  <text x="40" y="47" font-family="DM Sans,Arial,sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">CLP</text>
  <text x="128" y="52" font-family="DM Sans,Arial,sans-serif" font-weight="400" font-size="38" fill="#4C9BB0" text-anchor="middle" letter-spacing="-1">easy</text>
</svg></div>
      <div class="hdr-sub" style="color:#4C9BB0;font-size:10px">15 June 2026 · <span id="daysLeft"></span> days to launch</div>
    </div>
  </div>

  <div class="prog-wrap">
    <div class="prog-card">
      <div class="prog-top">
        <span>Project Status — <span id="totalStories"></span> stories</span>
        <span class="prog-pct" id="pctDone">0%</span>
      </div>
      <div class="prog-bar" id="progBar"></div>
      <div class="prog-legend" id="progLegend"></div>
    </div>
  </div>

  <div class="nav-tabs" id="navTabs">
    <button class="ntab active" onclick="goTab('board')">📋 Board</button>
    <button class="ntab" onclick="goTab('backlog')">🗂 Backlog</button>
    <button class="ntab" onclick="goTab('sprint0')">🚀 Pre-Launch</button>
    <button class="ntab" onclick="goTab('sprint1')">⚡ Sprint 1</button>
    <button class="ntab" onclick="goTab('sprint2')">🔮 Sprint 2</button>
  </div>

  <div class="content" id="content"></div>
</div>

<div id="toast"></div>

<div class="bnav">
  <button class="bnav-btn active" id="bn-board" onclick="goTab('board')"><span>📋</span><span>Board</span></button>
  <button class="bnav-btn" id="bn-backlog" onclick="goTab('backlog')"><span>🗂</span><span>Backlog</span></button>
  <button class="bnav-btn" id="bn-sprint0" onclick="goTab('sprint0')"><span>🚀</span><span>Pre-Launch</span></button>
  <button class="bnav-btn" id="bn-sprint1" onclick="goTab('sprint1')"><span>⚡</span><span>Sprint 1</span></button>
  <button class="bnav-btn" id="bn-sprint2" onclick="goTab('sprint2')"><span>🔮</span><span>Sprint 2</span></button>
</div>

<script>



// ── CONSTANTS ─────────────────────────────────────────────────────────────────
const EPIC_C = {Infra:'#4C9BB0',Auth:'#2980b9',Builder:'#8e44ad',Payments:'#27ae60',Legal:'#e67e22',Marketing:'#c0392b',Admin:'#d35400',PostLaunch:'#7f8c8d'};
const PRI_C = {1:'#e74c3c',2:'#e67e22',3:'#4C9BB0',4:'#7f8c8d'};
const PRI_L = {1:'P1 · Critical',2:'P2 · High',3:'P3 · Medium',4:'P4 · Low'};
const STAT_C = {DONE:'#27ae60','IN REVIEW':'#e67e22',BLOCKED:'#e74c3c',TODO:'#4a6580'};
const STAT_L = {DONE:'✓ Done','IN REVIEW':'⏳ Review',BLOCKED:'⛔ Blocked',TODO:'○ To Do'};
const SPRINTS = [
  {id:'S0',name:'Pre-Launch Sprint',goal:'Ship CLPeasy on 15 June 2026',weeks:'May – 14 Jun 2026',cap:85,color:'#4C9BB0'},
  {id:'S1',name:'Sprint 1 · Post-Launch',goal:'GPSR fixes, library, Cricut, fonts',weeks:'16 – 27 Jun 2026',cap:28,color:'#27ae60'},
  {id:'S2',name:'Sprint 2',goal:'Admin dashboard, forum, KB search',weeks:'30 Jun – 11 Jul 2026',cap:32,color:'#8e44ad'},
];

// ── STORY DATA ────────────────────────────────────────────────────────────────
const STORIES = [
  {id:'INF-01',epic:'Infra',pri:1,pts:3,status:'DONE',sprint:'S0',
   title:'Netlify + GitHub Deploy Pipeline',
   what:'Sets up the automated deployment pipeline so every code change pushed to the main branch on GitHub automatically goes live on clpeasy.com via Netlify — no manual uploads needed.',
   why:'Without this, every file would need uploading manually. The Dev branch workflow prevents the 326-deploy credit overrun that happened earlier.',
   story:'As a dev I need a stable deploy pipeline so every push to main goes live without consuming excess credits.',
   tasks:['Establish Dev branch — all work goes to Dev first, never directly to main','PR Dev → main triggers exactly one Netlify build','Delete stale C:\\Users\\micha\\supabase\\ folder to prevent workdir conflicts','Document deploy rule: cmd only, --no-verify-jwt --use-api from correct project folder','Confirm 326-deploy overrun resolved by Dev branch workflow'],
   ac:['Pushing to Dev does NOT trigger a Netlify rebuild','Merging Dev → main triggers exactly one Netlify build','No stale Supabase folders present on local machine','Deploy command documented and working']},

  {id:'INF-02',epic:'Infra',pri:1,pts:5,status:'DONE',sprint:'S0',
   title:'Supabase Project + Tables + RLS',
   what:'Configures the CLPeasy database — all tables that store user accounts, subscriptions, saved labels, safety sheets, and beta feedback. Row Level Security (RLS) means users can only ever see their own data.',
   why:'This is the data backbone of the entire product. Without it nothing saves, no subscriptions work, and there is no security.',
   story:'As a dev I need Supabase fully configured with all tables and row-level security so user data is protected.',
   tasks:['Confirm project ref qvkosdqcryrcfbjtaxic active and billing OK','Create profiles table: user_id FK, beta_expires, is_pro, display_name columns','Create subscriptions table: user_id, plan, status, stripe_customer_id, stripe_subscription_id, topup_credits','Create safety_sheets table: uid, label_data — NEVER delete on subscription lapse (QR codes stay live)','Create beta_feedback table: user_id, answers JSON, submitted_at','Apply RLS policies: users read/write own rows only','Deploy notify-signup edge function','Deploy clp-wizard edge function (AI Guide Me panel)','Deploy clp-search edge function (knowledge base AI search)'],
   ac:['All 5 tables exist in Supabase dashboard with correct columns','RLS enabled and confirmed via Supabase policy viewer','User A cannot read User B\'s data — tested','safety_sheets rows persist after subscription cancel — tested','All 3 edge functions show Deployed status in Supabase dashboard']},

  {id:'INF-03',epic:'Infra',pri:1,pts:3,status:'DONE',sprint:'S0',
   title:'Brevo Email + SMTP via Zoho',
   what:'Wires up all transactional emails (signup confirmation, password reset, onboarding sequence) to send from noreply@clpeasy.com using Zoho SMTP, delivered via Brevo.',
   why:'Professional branded emails build trust. Without this, Supabase sends from its own domain with no CLPeasy branding, which looks unprofessional and may land in spam.',
   story:'As a dev I need all transactional emails to send from the CLPeasy domain reliably.',
   tasks:['Configure Zoho SMTP in Supabase Auth email settings','Verify noreply@clpeasy.com and support@clpeasy.com deliverability (SPF, DKIM)','Regenerate Brevo API key and store in Supabase secrets as BREVO_API_KEY','Apply branded CLPeasy HTML template to Supabase confirmation email','Apply branded CLPeasy HTML template to Supabase password reset email','Build 7-email onboarding sequence in Brevo: Day 0, 2, 4, 7, 10, 12, 14','Activate automation in Brevo — trigger on contact added to list'],
   ac:['Confirmation email arrives within 60s with CLPeasy branding not Supabase default','Password reset email arrives within 60s with CLPeasy branding','Day 0 welcome email triggers within 5 mins of signup','Emails land in inbox not spam — tested on Gmail and Outlook','Sender shows as "CLPeasy" not the Supabase project ID']},

  {id:'INF-04',epic:'Infra',pri:1,pts:2,status:'IN REVIEW',sprint:'S0',
   title:'Wire Supabase new-user → Brevo Automation',
   what:'Every time someone creates a CLPeasy account, they are automatically added to the Brevo contact list and the 7-email onboarding sequence starts. This needs to be confirmed working end-to-end with a real email.',
   why:'If this is not wired, new users get no onboarding emails at all and are left confused after signing up.',
   story:'As a dev I need every new signup auto-added to the Brevo contact list so onboarding emails trigger automatically.',
   tasks:['Confirm notify-signup edge function is correctly deployed','Trigger function from Supabase Auth on_signup webhook — check webhook URL is set','Function POSTs to Brevo /contacts API with email + first name attributes','Confirm contact added to correct Brevo list ID','End-to-end test: create new account → check Brevo contacts appears within 2 mins','Verify Day 0 welcome email fires after contact is added','Check Supabase edge function logs for any 5xx errors'],
   ac:['New signup appears in Brevo contacts within 2 minutes','Contact assigned to correct onboarding list','Day 0 welcome email fires automatically with no manual trigger','Test confirmed with real email address not a test account','No errors in Supabase edge function logs']},

  {id:'INF-05',epic:'Infra',pri:2,pts:2,status:'TODO',sprint:null,
   title:'Link Checker Tool (link-checker.html)',
   what:'A password-protected admin page that tests every link on the CLPeasy site and reports which ones are broken (404) before launch day.',
   why:'A broken link on launch day damages trust immediately. This tool catches them all in one run the night before go-live.',
   story:'As an admin I need a password-gated tool that audits all site links so I can fix 404s before launch.',
   tasks:['Build link-checker.html as standalone admin page','Password gate on load — reject wrong password','Crawl all internal href values across all 14+ HTML pages','Fetch each URL and report HTTP status: 200 pass / 3xx redirect / 4xx broken','Display results as a clean pass/fail list','Run against production clpeasy.com on 14 June evening'],
   ac:['Page requires password to access','All internal links tested and status shown','Zero 4xx results confirmed on production site before launch','Report generates within 30 seconds']},

  {id:'INF-06',epic:'Infra',pri:2,pts:1,status:'TODO',sprint:null,
   title:'Live Sign-Up Count on monitor.html',
   what:'Adds a real-time user count card to the monitor.html admin page — showing total users, today\'s new signups, and active pro subscribers pulled live from Supabase.',

// ── STATE ─────────────────────────────────────────────────────────────────────
let currentTab = 'board';
let laneStatus = {};   // storyId → 'todo'|'doing'|'done'
let taskDone   = {};   // storyId+'-'+taskIdx → bool
let filterEpic = 'ALL';
let filterStat = 'ALL';
let modalId    = null;
let modalMode  = null; // 'lane'|'sprint'

// Init lane from story default
STORIES.forEach(s => {
  laneStatus[s.id] = s.sprint ? (s.status === 'DONE' ? 'done' : 'todo') : 'todo';
});

// ── HELPERS ───────────────────────────────────────────────────────────────────
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pts = arr => arr.reduce((a,s) => a + s.pts, 0);
const capPct = (p,c) => Math.round(p/c*100);
const capCol = pct => pct < 85 ? '#e67e22' : pct > 115 ? '#e74c3c' : '#27ae60';

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2400);
}

function daysl() {
  return Math.max(0, Math.round((new Date('2026-06-15') - new Date('2026-06-06')) / 86400000));
}



// ── INIT ──────────────────────────────────────────────────────────────────────
function init() {
  document.getElementById('daysLeft').textContent   = daysl();
  const activeCount = STORIES.filter(s => s.sprint === 'S0' && (s.status === 'TODO' || s.status === 'IN REVIEW')).length;
  document.getElementById('totalStories').textContent = activeCount + ' active · pre-launch only';
  renderProg();
  renderTab('board');
}

// ── PROGRESS ──────────────────────────────────────────────────────────────────
function renderProg() {
  // Only count active pre-launch items: TODO + IN REVIEW
  // DONE, BLOCKED (launch day), post-launch all excluded from bar
  const active = STORIES.filter(s => s.sprint === 'S0' && (s.status === 'TODO' || s.status === 'IN REVIEW'));
  const todo   = active.filter(s => s.status === 'TODO').length;
  const review = active.filter(s => s.status === 'IN REVIEW').length;
  const total  = active.length;
  const pct    = total === 0 ? 100 : Math.round(review / total * 100);

  const s0done    = STORIES.filter(s => s.sprint === 'S0' && s.status === 'DONE').length;
  const s0blocked = STORIES.filter(s => s.sprint === 'S0' && s.status === 'BLOCKED').length;

  const pctDone = STORIES.filter(s => s.sprint === 'S0').length === 0 ? 0 :
    Math.round(STORIES.filter(s => s.sprint === 'S0' && s.status === 'DONE').length /
               STORIES.filter(s => s.sprint === 'S0').length * 100);
  document.getElementById('pctDone').textContent = pctDone + '% · ' + total + ' left';
  document.getElementById('progBar').innerHTML =
    `<div style="flex:${review};background:#e67e22;min-width:${review>0?'4px':'0'}"></div>` +
    `<div style="flex:${todo};background:#2d4a5e;min-width:${todo>0?'4px':'0'}"></div>`;
  document.getElementById('progLegend').innerHTML =
    [[review,'⏳ In Review','#e67e22'],[todo,'○ To Do','#4a6580']]
    .map(([n,l,c]) => `<div class="leg"><div class="leg-dot" style="background:${c}"></div><span style="color:#7a9fb5">${l}:</span><span style="color:${c};font-weight:800">${n}</span></div>`).join('') +
    `<div class="leg"><div class="leg-dot" style="background:#27ae60"></div><span style="color:#7a9fb5">Completed:</span><span style="color:#27ae60;font-weight:800">${s0done} filed</span></div>` +
    `<div class="leg"><div class="leg-dot" style="background:#e74c3c"></div><span style="color:#7a9fb5">Launch day:</span><span style="color:#e74c3c;font-weight:800">${s0blocked} pending</span></div>`;
}

// ── TAB NAVIGATION ────────────────────────────────────────────────────────────
function goTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.ntab').forEach((b,i) => b.classList.toggle('active', ['board','backlog','sprint0','sprint1','sprint2'][i] === tab));
  document.querySelectorAll('.bnav-btn').forEach(b => b.classList.remove('active'));
  const bn = document.getElementById('bn-' + tab);
  if (bn) bn.classList.add('active');
  renderTab(tab);
}

function renderTab(tab) {
  if (tab === 'board')   renderBoard();
  else if (tab === 'backlog') renderBacklog();
  else if (tab === 'sprint0') renderSprintDetail('S0');
  else if (tab === 'sprint1') renderSprintDetail('S1');
  else if (tab === 'sprint2') renderSprintDetail('S2');
}

// ── STORY CARD (full detail) ──────────────────────────────────────────────────
function storyCard(s) {
  const ec  = EPIC_C[s.epic] || '#4C9BB0';
  const sc  = STAT_C[s.status] || '#4a6580';
  const sp  = s.sprint ? SPRINTS.find(x => x.id === s.sprint)?.name : 'Backlog';
  const ll  = {todo:'To Do',doing:'Doing',done:'Done'};
  const lane = laneStatus[s.id] || 'todo';

  const tasks = s.tasks.map((t,i) => {
    const k = s.id + '-' + i;
    const done = !!taskDone[k];
    return `<div class="dp-item">
      <span class="dp-num">${String(i+1).padStart(2,'0')}</span>
      <span class="dp-check" onclick="toggleTask('${s.id}',${i})">${done ? '✅' : '⬜'}</span>
      <span class="dp-text ${done ? 'struck' : ''}" id="dt-${k}">${esc(t)}</span>
    </div>`;
  }).join('');

  const ac = s.ac.map(a => `<div class="dp-item">
    <span class="ac-tick">✓</span>
    <span class="dp-text">${esc(a)}</span>
  </div>`).join('');

  const doneCount = s.tasks.filter((_,i) => taskDone[s.id+'-'+i]).length;
  const pct = Math.round(doneCount / s.tasks.length * 100);

  return `<div class="sc" id="sc-${s.id}" style="border-left-color:${ec}">
    <div class="sc-top">
      <div class="sc-left">
        <div class="sc-ids">
          <span class="sc-id">${esc(s.id)}</span>
          <span class="chip" style="background:${ec}22;color:${ec}">${esc(s.epic)}</span>
          <span class="chip" style="background:${PRI_C[s.pri]}22;color:${PRI_C[s.pri]}">${PRI_L[s.pri]}</span>
        </div>
        <div class="sc-title">${esc(s.title)}</div>
        <div class="sc-meta-row">
          <span class="sc-meta-chip">📍 ${esc(sp)}</span>
          <span class="sc-meta-chip">🏷 ${ll[lane]}</span>
          <span class="sc-meta-chip">⭐ ${s.pts}pts</span>
          <span class="sc-meta-chip">✅ ${doneCount}/${s.tasks.length} tasks</span>
        </div>
        ${pct > 0 ? `<div style="background:#0d1b2a;border-radius:3px;height:4px;overflow:hidden;margin-bottom:4px"><div style="width:${pct}%;height:100%;background:${ec};border-radius:3px"></div></div>` : ''}
      </div>
      <div class="sc-right">
        <button class="status-btn" style="background:${sc}22;color:${sc}" onclick="cycleStatus('${s.id}',event)">${STAT_L[s.status]}</button>
        <button class="status-btn" style="background:#1e3048;color:#7a9fb5;font-size:9px" onclick="openModal('${s.id}',event)">Move ↗</button>
      </div>
    </div>

    <!-- WHAT IS THIS / WHY -->
    <div style="padding:0 14px 10px">
      <div style="font-size:10px;font-weight:800;color:#4C9BB0;letter-spacing:0.4px;margin-bottom:4px">WHAT IS THIS</div>
      <div style="font-size:11px;color:#7a9fb5;line-height:1.55;margin-bottom:8px">${esc(s.what)}</div>
      <div style="font-size:10px;font-weight:800;color:#e67e22;letter-spacing:0.4px;margin-bottom:4px">WHY IT MATTERS</div>
      <div style="font-size:11px;color:#7a9fb5;line-height:1.55;margin-bottom:8px">${esc(s.why)}</div>
      <div style="font-size:10px;font-weight:800;color:#7a9fb5;letter-spacing:0.4px;margin-bottom:4px">USER STORY</div>
      <div style="font-size:11px;color:#4a6580;line-height:1.5;font-style:italic;margin-bottom:10px">"${esc(s.story)}"</div>

      <!-- TASKS -->
      <div style="font-size:10px;font-weight:800;color:#4C9BB0;letter-spacing:0.4px;margin-bottom:6px">ACTION TASKS — tap ⬜ to tick off (${doneCount}/${s.tasks.length} done)</div>
      <div id="tasks-${s.id}">${tasks}</div>

      <!-- ACCEPTANCE -->
      <div style="font-size:10px;font-weight:800;color:#27ae60;letter-spacing:0.4px;margin:10px 0 6px">DONE WHEN</div>
      ${ac}
    </div>
  </div>`;
}

// ── TASK TICK ─────────────────────────────────────────────────────────────────
function toggleTask(sid, idx) {
  const k = sid + '-' + idx;
  taskDone[k] = !taskDone[k];
  // Re-render just this card
  const s = STORIES.find(x => x.id === sid);
  const el = document.getElementById('sc-' + sid);
  if (el) el.outerHTML = storyCard(s);
  toast(taskDone[k] ? '✅ Task marked done' : '⬜ Task unmarked');
  renderProg();
}

// ── STATUS CYCLE ──────────────────────────────────────────────────────────────
function cycleStatus(sid, e) {
  e.stopPropagation();
  const s = STORIES.find(x => x.id === sid);
  const cycle = {TODO:'IN REVIEW','IN REVIEW':'DONE',DONE:'TODO',BLOCKED:'IN REVIEW'};
  s.status = cycle[s.status] || 'IN REVIEW';
  if (s.sprint) {
    if (s.status === 'DONE') laneStatus[sid] = 'done';
    else if (s.status === 'IN REVIEW') laneStatus[sid] = 'doing';
    else laneStatus[sid] = 'todo';
  }
  const el = document.getElementById('sc-' + sid);
  if (el) el.outerHTML = storyCard(s);
  renderProg();
  toast(sid + ' → ' + s.status);
}

// ── MOVE MODAL ────────────────────────────────────────────────────────────────
function openModal(sid, e) {
  e.stopPropagation();
  modalId = sid;
  const s = STORIES.find(x => x.id === sid);
  document.getElementById('mm-title').textContent = s.title;
  document.getElementById('mm-sub').textContent   = 'Move to sprint and lane';
  let html = '<div class="sheet-sprint-grid">';
  SPRINTS.forEach(sp => {
    html += `<button class="sheet-sprint-btn" style="border-left:3px solid ${sp.color}" onclick="pickSprint('${sp.id}')">
      <div style="font-size:11px;font-weight:800;color:${sp.color}">${esc(sp.name)}</div>
      <div style="font-size:10px;color:#7a9fb5;margin-top:2px">${esc(sp.goal)}</div>
    </button>`;
  });
  html += `<button class="sheet-sprint-btn" style="border-left:3px solid #4a6580" onclick="pickSprint(null)">
    <div style="font-size:11px;font-weight:800;color:#7a9fb5">Return to Backlog</div>
  </button>`;
  html += '</div>';
  html += '<div style="font-size:10px;font-weight:800;color:#7a9fb5;margin-bottom:6px;letter-spacing:0.4px">THEN SET LANE:</div>';
  html += '<div class="sheet-grid">';
  [['todo','○ To Do','#4a6580'],['doing','⟳ Doing','#e67e22'],['done','✓ Done','#27ae60']].forEach(([id,lbl,col]) => {
    html += `<button class="sheet-btn" style="color:${col};border-color:${col}22" onclick="pickLane('${id}')">${lbl}</button>`;
  });
  html += '</div>';
  document.getElementById('mm-body').innerHTML = html;
  document.getElementById('moveModal').classList.add('open');
}

function pickSprint(sprintId) {
  if (!modalId) return;
  const s = STORIES.find(x => x.id === modalId);
  s.sprint = sprintId;
  if (!sprintId) laneStatus[modalId] = 'todo';
  toast(sprintId ? `Moved to ${SPRINTS.find(x=>x.id===sprintId)?.name}` : 'Returned to Backlog');
  renderProg();
}

function pickLane(laneId) {
  if (!modalId) return;
  laneStatus[modalId] = laneId;
  closeModal();
  renderTab(currentTab);
  toast('Lane → ' + {todo:'To Do',doing:'Doing',done:'Done'}[laneId]);
}

function closeModal() {
  document.getElementById('moveModal').classList.remove('open');
  modalId = null;
}

// ── BOARD TAB ─────────────────────────────────────────────────────────────────
function renderBoard() {
  let h = '';

  // Only show TODO and IN REVIEW — the live action items
  const todo   = STORIES.filter(s => s.sprint === 'S0' && s.status === 'TODO').sort((a,b) => a.pri - b.pri);
  const review = STORIES.filter(s => s.sprint === 'S0' && s.status === 'IN REVIEW').sort((a,b) => a.pri - b.pri);

  if (!todo.length && !review.length) {
    h += `<div style="background:#111d2c;border:1px solid #27ae60;border-radius:12px;padding:24px;text-align:center;margin-bottom:12px">
      <div style="font-size:24px;margin-bottom:8px">🚀</div>
      <div style="font-size:14px;font-weight:800;color:#27ae60">All active items complete!</div>
      <div style="font-size:11px;color:#7a9fb5;margin-top:4px">Ready to go live on 15 June 2026.</div>
    </div>`;
  }

  if (todo.length) {
    h += sectionHeader('○ To Do — Action Required', todo.length + ' items need starting', '#4a6580');
    todo.forEach(s => { h += storyCard(s); });
  }

  if (review.length) {
    h += sectionHeader('⏳ In Review — Needs Final Check', review.length + ' items to confirm', '#e67e22');
    review.forEach(s => { h += storyCard(s); });
  }

  // Everything else collapsed — done, launch day, post-launch — all filed away
  const filed = [
    ...STORIES.filter(s => s.sprint === 'S0' && s.status === 'BLOCKED'),
    ...STORIES.filter(s => s.sprint === 'S0' && s.status === 'DONE'),
    ...STORIES.filter(s => s.sprint === 'S1' || s.sprint === 'S2' || !s.sprint),
  ];

  const filedDone    = STORIES.filter(s => s.sprint === 'S0' && s.status === 'DONE').length;
  const filedBlocked = STORIES.filter(s => s.sprint === 'S0' && s.status === 'BLOCKED').length;
  const filedPost    = STORIES.filter(s => s.sprint === 'S1' || s.sprint === 'S2' || !s.sprint).length;

  h += `<div style="margin-top:10px">
    <button onclick="toggleArchive()"
      style="width:100%;background:#0a1520;border:1px solid #1e3048;border-radius:10px;
             padding:12px 16px;font-size:12px;font-weight:800;cursor:pointer;
             font-family:inherit;display:flex;justify-content:space-between;align-items:center;color:#4a6580;">
      <div style="text-align:left">
        <div>📁 All Other Items — Collapsed</div>
        <div style="font-size:9px;font-weight:600;margin-top:3px;color:#2d4a5e">
          ✓ ${filedDone} completed · ⛔ ${filedBlocked} launch day · 🔮 ${filedPost} post-launch
        </div>
      </div>
      <span id="archiveChevron" style="font-size:16px;color:#2d4a5e">▸</span>
    </button>
    <div id="archiveSection" style="display:none;margin-top:6px">

      ${filedBlocked > 0 ? `<div style="background:#0a1520;border:1px solid #e74c3c33;border-left:4px solid #e74c3c;border-radius:10px;padding:10px 14px;margin-bottom:8px">
        <div style="font-size:12px;font-weight:900;color:#e74c3c">⛔ Launch Day — Execute on 15 June Only</div>
        <div style="font-size:10px;color:#7a9fb5;margin-top:2px">Do not touch until launch morning</div>
      </div>
      ${STORIES.filter(s => s.sprint === 'S0' && s.status === 'BLOCKED').map(s => storyCard(s)).join('')}` : ''}

      ${filedDone > 0 ? `<div style="background:#0a1520;border:1px solid #27ae6033;border-left:4px solid #27ae60;border-radius:10px;padding:10px 14px;margin-bottom:8px;margin-top:8px">
        <div style="font-size:12px;font-weight:900;color:#27ae60">✓ Completed Pre-Launch Items</div>
        <div style="font-size:10px;color:#7a9fb5;margin-top:2px">${filedDone} items done and filed</div>
      </div>
      ${STORIES.filter(s => s.sprint === 'S0' && s.status === 'DONE').map(s => storyCard(s)).join('')}` : ''}

      ${filedPost > 0 ? `<div style="background:#0a1520;border:1px dashed #1e3048;border-radius:10px;padding:10px 14px;margin-bottom:8px;margin-top:8px">
        <div style="font-size:12px;font-weight:900;color:#7f8c8d">🔮 Post-Launch Backlog (Sprint 1 &amp; 2)</div>
        <div style="font-size:10px;color:#4a6580;margin-top:2px">${filedPost} stories queued for after 15 June</div>
      </div>
      ${STORIES.filter(s => s.sprint === 'S1' || s.sprint === 'S2' || !s.sprint).sort((a,b)=>a.pri-b.pri).map(s => storyCard(s)).join('')}` : ''}

    </div>
  </div>`;

  document.getElementById('content').innerHTML = h;
}

function sectionHeader(title, sub, color) {
  return `<div style="background:#111d2c;border:1px solid ${color}33;border-left:4px solid ${color};
    border-radius:10px;padding:10px 14px;margin-bottom:8px;margin-top:4px">
    <div style="font-size:12px;font-weight:900;color:${color};letter-spacing:0.4px">${title}</div>
    <div style="font-size:10px;color:#7a9fb5;margin-top:2px">${sub}</div>
  </div>`;
}

function toggleArchive() {
  const sec  = document.getElementById('archiveSection');
  const chev = document.getElementById('archiveChevron');
  const open = sec.style.display !== 'none';
  sec.style.display = open ? 'none' : 'block';
  chev.textContent  = open ? '▸' : '▾';
}

// ── SPRINT DETAIL TAB ─────────────────────────────────────────────────────────
function renderSprintDetail(sprintId) {
  const sprint = SPRINTS.find(s => s.id === sprintId);
  const ss     = STORIES.filter(s => s.sprint === sprintId).sort((a,b) => a.pri - b.pri);
  const p      = pts(ss);
  const pct    = capPct(p, sprint.cap);
  const cc     = capCol(pct);

  let h = `<div class="sprint-hdr" style="border-top-color:${sprint.color};border-radius:12px;margin-bottom:12px">
    <div class="sprint-hdr-top">
      <div class="sprint-name" style="color:${sprint.color}">${esc(sprint.name.toUpperCase())}</div>
      <div class="sprint-kpi" style="color:${cc}">${pct}% capacity</div>
    </div>
    <div class="sprint-weeks">${esc(sprint.weeks)}</div>
    <div class="sprint-goal">${esc(sprint.goal)}</div>
    <div class="cap-wrap" style="margin-top:6px"><div class="cap-fill" style="width:${Math.min(pct,130)}%;background:${cc}"></div></div>
    <div class="cap-row"><span style="color:${cc};font-weight:700">${p}/${sprint.cap}pts · ${ss.length} stories</span><span style="color:${pct>=85&&pct<=115?'#27ae60':'#e67e22'};font-weight:700">${pct<85?'Under-loaded':pct>115?'Over-loaded':'✓ Healthy load'}</span></div>
  </div>`;

  if (ss.length === 0) {
    h += `<div style="background:#111d2c;border:1px solid #1e3048;border-radius:12px;padding:24px;text-align:center;color:#2d4a5e;font-size:12px">No stories assigned yet — go to Board or Backlog and tap Move ↗</div>`;
  } else {
    ss.forEach(s => { h += storyCard(s); });
  }

  document.getElementById('content').innerHTML = h;
}

// ── BACKLOG TAB ───────────────────────────────────────────────────────────────
function renderBacklog() {
  const allEpics = [...new Set(STORIES.map(s => s.epic))];
  let h = `<div class="fbar">
    ${['ALL',...allEpics].map(e => `<button class="fbtn ${filterEpic===e?'active':''}" style="${filterEpic===e?'background:'+(EPIC_C[e]||'#4C9BB0'):''}" onclick="setEpicF('${e}')">${e}</button>`).join('')}
  </div>
  <div class="fbar">
    ${['ALL','DONE','IN REVIEW','BLOCKED','TODO'].map(s => `<button class="fbtn ${filterStat===s?'active':''}" onclick="setStatF('${s}')">${s}</button>`).join('')}
  </div>`;

  [1,2,3,4].forEach(pri => {
    const group = STORIES.filter(s => {
      if (s.pri !== pri) return false;
      if (filterEpic !== 'ALL' && s.epic !== filterEpic) return false;
      if (filterStat !== 'ALL' && s.status !== filterStat) return false;
      return true;
    });
    if (!group.length) return;
    const pc = PRI_C[pri];
    const dk = group.filter(s => s.status === 'DONE').length;
    h += `<div class="bl-section">
      <div class="bl-hdr" style="border-left-color:${pc}">
        <div>
          <div class="bl-pri" style="color:${pc}">${PRI_L[pri]}</div>
          <div style="font-size:10px;color:#7a9fb5;margin-top:2px">${group.length} stories · ${pts(group)}pts · ${dk} done</div>
        </div>
      </div>
      ${group.map(s => storyCard(s)).join('')}
    </div>`;
  });

  document.getElementById('content').innerHTML = h;
}

function setEpicF(e) { filterEpic = e; renderBacklog(); }
function setStatF(s) { filterStat = s; renderBacklog(); }
</script>

</body>
</html>
